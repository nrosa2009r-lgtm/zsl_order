[graph]
all-features = true
targets = []

[advisories]
version = 2
yanked = "warn"
ignore = [
    # sqlx 0.8/0.9 nie wspiera jeszcze libsqlite3-sys >= 0.39 z poprawką;
    # baza nie przyjmuje plików SQLite od użytkowników. Szczegóły i plan
    # aktualizacji: .cargo/audit.toml oraz śledzenie wydań sqlx.
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
