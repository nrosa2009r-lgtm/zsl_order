[package]
name = "zsl_order"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "System zamawiania posiłków dla stołówki szkolnej ZSŁ (bez danych osobowych)"
autobins = false

[[bin]]
name = "zsl-order"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
dotenvy = "0.15"
ipnet = "2"
jsonwebtoken = "9"
tower-http = { version = "0.5", features = ["fs", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }

[profile.release]
opt-level = 3       # Maksymalna optymalizacja pod kątem szybkości kodu
lto = "fat"         # Głęboka, globalna optymalizacja między skrzynkami (LTO)
codegen-units = 1   # Pozwała na lepszą optymalizację całego kodu jako całości
panic = "abort"     # Usuwa narzut związany z obsługą odwijania stosu
strip = true        # Mniejszy i szybszy do wczytania plik binarny
