name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint, test i smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatowanie
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testy
        run: cargo test --locked

      - name: Build debug (smoke)
        run: cargo build --locked

      - name: Zależności systemowe do smoke
        run: sudo apt-get update && sudo apt-get install -y sqlite3 jq

      - name: Smoke testy
        run: |
          set -euo pipefail
          scripts/smoke-modes.sh
          scripts/smoke-hardening.sh
          scripts/test-migrations.sh
          scripts/smoke-orders.sh
          scripts/smoke-backup.sh
          scripts/smoke-logs.sh

  security:
    name: Audyt zależności i licencji
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Instalacja cargo-audit i cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny (licencje, źródła, banery)
        run: cargo deny check
